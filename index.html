<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll Portal - CL113</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha512-r22gChDnGNGC62wbJu56vvVzpOHcBZF8jhkcKbmGB83vKEkvhKnrKa2Z9uv9A1pZHFTvqP1gCCoC...==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans">

  <!-- TOP NAV -->
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur shadow-sm">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-emerald-600 text-white font-bold text-lg shadow-sm">
          CL
        </div>
        <div>
          <h1 class="text-base font-semibold leading-tight text-slate-900">The Chopped Leaf</h1>
          <p class="text-xs text-slate-500">Payroll Viewer & Compliance Engine</p>
        </div>
      </div>
      <span class="inline-flex items-center rounded-full bg-emerald-50 px-3 py-1 text-xs font-medium text-emerald-700 ring-1 ring-inset ring-emerald-600/20">
        CL113 &middot; Dartmouth Crossing
      </span>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="flex-1 pb-16 pt-6">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 space-y-6">

      <!-- UPLOAD DROP ZONE -->
      <section id="upload-card" class="rounded-xl border-2 border-dashed border-slate-300 bg-white p-8 sm:p-12 text-center transition hover:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20">
        <div class="mx-auto flex max-w-xs flex-col items-center">
          <div class="rounded-full bg-slate-100 p-3 text-slate-600 mb-3">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
          </div>
          <label for="file-input" class="cursor-pointer text-sm font-semibold text-emerald-600 hover:text-emerald-500 focus-within:outline-none">
            <span>Upload a time card file</span>
            <input id="file-input" type="file" accept=".xlsx,.xls,.csv" class="sr-only" onchange="handleFileSelect(event)">
          </label>
          <p class="mt-1 text-xs text-slate-500">XLSX, XLS, or CSV up to 10MB</p>
          <div id="upload-spinner" class="hidden mt-4 flex items-center gap-2 text-xs text-emerald-600 font-medium">
            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            Processing workforce records...
          </div>
          <p id="upload-error" class="mt-3 text-xs text-rose-600 font-medium hidden" role="alert"></p>
        </div>
      </section>

      <!-- RESULTS DASHBOARD (HIDDEN DEFAULT) -->
      <div id="dashboard" class="hidden space-y-6">

        <!-- CONTROLS & COMPLIANCE BAR -->
        <section aria-label="Compliance Configuration" class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 flex-1">
              <div>
                <label for="min-break" class="block text-xs font-medium text-slate-600">Min Break (m)</label>
                <input id="min-break" type="number" value="25" class="mt-1 block w-full rounded-md border-slate-300 text-sm shadow-sm focus:border-emerald-500 focus:ring-emerald-500">
              </div>
              <div>
                <label for="max-break" class="block text-xs font-medium text-slate-600">Max Break (m)</label>
                <input id="max-break" type="number" value="35" class="mt-1 block w-full rounded-md border-slate-300 text-sm shadow-sm focus:border-emerald-500 focus:ring-emerald-500">
              </div>
              <div>
                <label for="long-shift" class="block text-xs font-medium text-slate-600">Long Shift (h)</label>
                <input id="long-shift" type="number" value="5" step="0.5" class="mt-1 block w-full rounded-md border-slate-300 text-sm shadow-sm focus:border-emerald-500 focus:ring-emerald-500">
              </div>
              <div class="flex items-end">
                <button onclick="recalculate()" class="w-full h-9 rounded-md bg-slate-900 text-xs font-semibold text-white shadow hover:bg-slate-800 transition">
                  Apply Rules
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- STATS GRID -->
        <section aria-label="Payroll Summary Metrics" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
            <dt class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Worked Hours</dt>
            <dd id="metric-total-hours" class="mt-1 text-2xl font-bold tracking-tight text-slate-900">0.00</dd>
          </div>
          <div class="rounded-xl border border-rose-200 bg-rose-50/50 p-4 shadow-sm">
            <dt class="text-xs font-medium text-rose-700 uppercase tracking-wider">Missing Breaks</dt>
            <dd id="metric-missing-breaks" class="mt-1 text-2xl font-bold tracking-tight text-rose-700">0</dd>
          </div>
          <div class="rounded-xl border border-amber-200 bg-amber-50/50 p-4 shadow-sm">
            <dt class="text-xs font-medium text-amber-700 uppercase tracking-wider">Break Range Deviations</dt>
            <dd id="metric-range-errors" class="mt-1 text-2xl font-bold tracking-tight text-amber-700">0</dd>
          </div>
          <div class="rounded-xl border border-blue-200 bg-blue-50/50 p-4 shadow-sm">
            <dt class="text-xs font-medium text-blue-700 uppercase tracking-wider">Active Staff Count</dt>
            <dd id="metric-staff-count" class="mt-1 text-2xl font-bold tracking-tight text-blue-700">0</dd>
          </div>
        </section>

        <!-- TABLE WORKSPACE -->
        <section aria-label="Employee Hours" class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase text-slate-500 tracking-wider">
                <tr>
                  <th scope="col" class="px-6 py-3">Employee Name</th>
                  <th scope="col" class="px-6 py-3">Compliance Status</th>
                  <th scope="col" class="px-6 py-3 text-right">Calculated Hours</th>
                  <th scope="col" class="px-6 py-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="payroll-tbody" class="divide-y divide-slate-200">
                <!-- Dynamic Rows Injected Here -->
              </tbody>
            </table>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script>
    let appState = { employees: [] };

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('upload-spinner').classList.remove('hidden');
      document.getElementById('upload-error').classList.add('hidden');

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
          parsePayrollRows(rows);
          document.getElementById('upload-card').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
        } catch (err) {
          showError("Failed to parse file structure. Verify file format.");
        } finally {
          document.getElementById('upload-spinner').classList.add('hidden');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function showError(msg) {
      const errEl = document.getElementById('upload-error');
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    function parsePayrollRows(rows) {
      const emps = [];
      let current = null;
      const nameRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ'\-]+,\s+[A-Za-zÀ-ÖØ-öø-ÿ'\- ]+/;

      rows.forEach(r => {
        const c0 = String(r[0] || '').trim();
        if (nameRegex.test(c0)) {
          current = { name: c0, hours: 0, flags: [] };
          emps.push(current);
        } else if (current && parseFloat(r[2]) > 0) {
          const reg = parseFloat(r[6]) || 0;
          const ot = parseFloat(r[8]) || 0;
          current.hours += (reg + ot);
        }
      });
      appState.employees = emps;
      render();
    }

    function recalculate() { render(); }

    function render() {
      const tbody = document.getElementById('payroll-tbody');
      tbody.innerHTML = '';
      let totalStoreHours = 0;

      appState.employees.forEach((emp, idx) => {
        totalStoreHours += emp.hours;
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50/80 transition";
        tr.innerHTML = `
          <td class="px-6 py-4 font-medium text-slate-900">${escapeHtml(emp.name)}</td>
          <td class="px-6 py-4">
            <span class="inline-flex items-center rounded-md bg-emerald-50 px-2 py-1 text-xs font-medium text-emerald-700 ring-1 ring-inset ring-emerald-600/20">Compliant</span>
          </td>
          <td class="px-6 py-4 text-right">
            <input type="number" step="0.25" min="0" value="${emp.hours.toFixed(2)}"
              onchange="updateHours(${idx}, this.value)"
              class="w-24 rounded-md border-slate-300 text-right font-mono text-sm focus:border-emerald-500 focus:ring-emerald-500">
          </td>
          <td class="px-6 py-4 text-right">
            <button onclick="copyHours(${emp.hours}, this)" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-600 hover:text-slate-900">
              Copy
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('metric-total-hours').textContent = totalStoreHours.toFixed(2);
      document.getElementById('metric-staff-count').textContent = appState.employees.length;
    }

    function updateHours(idx, val) {
      const parsed = parseFloat(val);
      appState.employees[idx].hours = isNaN(parsed) || parsed < 0 ? 0 : parsed;
      render();
    }

    function copyHours(val, btn) {
      navigator.clipboard.writeText(val.toFixed(2));
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = "Copy", 1500);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
